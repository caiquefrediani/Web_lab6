<!doctype html>
<html lang='en'>
	<head>
		<title> Open your account at AIB! </title>
		<link rel="stylesheet" href="style.css">
	</head>
	
	<body>
		<h1 class='tit'>Open your account at AIB!</h1>
			<form class='bb'> 
				<label> Name: </label>
				<input name='fullname' type='text'/>
				<br><br>
				
				<label> Date of birth: </label>
				<input name='birthdate' type='birth'/>
				<br><br>
				
				<label> IRP card number: </label>
				<input name='IRPnumber' type='number'/>
				<br><br>
				
				<label> Home address: </label>
				<input name='Fulladdress' type='text'/>
				<br><br>
				
				<label> Eircode: </label>
				<input name='Eircode' type='text/number'/>
				<br><br>
				
				<label> Phone number: </label>
				<input name='phoneNumber' type='number'/>
				<br><br>
				
				<label for="account-type">Account Type:</label>

				<select id="account-type" name="account-type" required>
					<option value=""> Select </option>
					<option value="current">Current Account</option>
					<option value="savings">Savings Account</option>
					<option value="student">Student Account</option>
					<option value="joint">Joint Account</option>
					<option value="business">Business Account</option>
				</select>
				<br><br>
				
				<label> Email address: </label>
				<input name='Email' type='text'/>
				<br><br>
				
				<button class='bot'> Submit </button>
			</form>
	</body>
</html>
